<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hissez Panel</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#7f1d3a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="panel.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hissez Panel">

</head>
<body>
  <main class="admin-shell">
    <section class="login-screen" id="loginScreen">
      <div class="login-card">
        <div class="login-brand">
          <img class="panel-logo-img" src="assets/img/hissez-logo.png" alt="Hissez logo">
          <strong><span class="brand-his">His</span><span class="brand-sez">sez</span> Panel</strong>
        </div>
        <h1>Sezin’in yazı paneli</h1>
        <p>Bu alan sadece yetkili kullanıcı girişiyle açılır.</p>
        <button class="btn btn-light theme-btn login-theme-btn" data-admin-theme-toggle type="button" aria-label="Tema değiştir">🌙 Karanlık Mod</button>

        <div id="loginNotice" class="notice" hidden></div>

        <form id="loginForm" class="auth-form">
          <label>
            <span>E-posta</span>
            <input type="email" id="loginEmail" autocomplete="email" required placeholder="ornek@mail.com">
          </label>
          <label>
            <span>Şifre</span>
            <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••">
          </label>
          <button class="btn btn-primary" type="submit">Giriş Yap</button>
        </form>
      </div>
    </section>

    <section class="panel-screen" id="panelScreen" hidden>
      <aside class="panel-sidebar">
        <div class="panel-brand">
          <img class="panel-logo-img" src="assets/img/hissez-logo.png" alt="Hissez logo">
          <strong><span class="brand-his">His</span><span class="brand-sez">sez</span></strong>
        </div>
        <nav>
          <a href="#editor" class="active">Yazı Ekle</a>
          <a href="#posts">Yazılar</a>
          <a href="index.html" target="_blank" rel="noopener">Siteyi Aç</a>
        </nav>
        <button class="btn btn-light" id="logoutButton" type="button">Çıkış Yap</button>
      </aside>

      <section class="panel-main">
        <header class="panel-topbar">
          <div>
            <p class="eyebrow">Yönetim paneli</p>
            <h1>Şiir ve gün notlarını yönet</h1>
          </div>
          <div class="panel-topbar-actions">
            <button class="btn btn-light theme-btn" id="adminThemeToggle" data-admin-theme-toggle type="button" aria-label="Tema değiştir">🌙 Karanlık Mod</button>
            <div class="user-pill" id="userEmail">Giriş yapılıyor...</div>
          </div>
        </header>

        <div id="adminNotice" class="notice" hidden></div>

        <section class="editor-card" id="editor">
          <div class="card-head">
            <div>
              <p class="eyebrow">Editör</p>
              <h2 id="editorTitle">Yeni yazı</h2>
            </div>
            <button class="btn btn-light" id="resetFormButton" type="button">Formu Temizle</button>
          </div>

          <form id="postForm" class="post-form">
            <input type="hidden" id="editingId">

            <div class="form-grid">
              <label>
                <span>Başlık</span>
                <input type="text" id="postTitle" maxlength="120" required placeholder="Örn: İçimde Kalan Bir Cümle">
              </label>

              <label>
                <span>Yayın tarihi</span>
                <input type="date" id="postDate" required>
              </label>

              <label>
                <span>Yazı türü</span>
                <select id="postType" required>
                  <option value="poem">Şiir</option>
                  <option value="daily">Gün Notu</option>
                </select>
              </label>

              <label>
                <span>Kategori</span>
                <input type="text" id="postCategory" maxlength="50" placeholder="Örn: Şiir, Gün Notu, İç Döküş">
              </label>

              <label>
                <span>Durum</span>
                <select id="postStatus" required>
                  <option value="draft">Taslak</option>
                  <option value="published">Yayında</option>
                </select>
              </label>

              <label class="check-row">
                <input type="checkbox" id="postFeatured">
                <span>Öne çıkan yazı olsun</span>
              </label>
            </div>

            <label>
              <span>Kısa açıklama</span>
              <textarea id="postExcerpt" rows="3" maxlength="220" placeholder="Kartlarda görünecek kısa giriş metni. Boş kalırsa içerikten otomatik alınır."></textarea>
            </label>

            <label>
              <span>İçerik</span>
              <textarea id="postContent" rows="14" required placeholder="Sezin’in yazısı burada..."></textarea>
            </label>

            <div class="editor-actions">
              <button class="btn btn-light" id="saveDraftButton" type="button">Taslak Kaydet</button>
              <button class="btn btn-primary" id="publishButton" type="button">Yayına Al</button>
              <button class="btn btn-dark" type="submit">Seçili Durumla Kaydet</button>
            </div>
          </form>
        </section>

        <section class="posts-manager" id="posts">
          <div class="card-head">
            <div>
              <p class="eyebrow">İçerikler</p>
              <h2>Kayıtlı yazılar</h2>
            </div>
            <div class="filter-row">
              <select id="statusFilter">
                <option value="all">Tüm durumlar</option>
                <option value="published">Yayında</option>
                <option value="draft">Taslak</option>
              </select>
              <select id="typeFilter">
                <option value="all">Tüm türler</option>
                <option value="poem">Şiir</option>
                <option value="daily">Gün Notu</option>
              </select>
            </div>
          </div>

          <div id="adminPostsList" class="admin-post-list">
            <div class="empty-state">Yazılar yükleniyor...</div>
          </div>
        </section>
      </section>
    </section>
  </main>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
